name: Build Public CV Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'cv/**'
      - 'research/**'
      - 'scripts/**'
      - 'Makefile'
      - 'README.md'
      - 'PUBLIC_MANIFEST.md'
      - '.github/workflows/build-public-research-status.yml'

permissions:
  contents: read

concurrency:
  group: public-cv-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-public-package:
    if: ${{ github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out public repository
        uses: actions/checkout@v4

      - name: Install LaTeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern

      - name: Build public CV package
        run: |
          set -euo pipefail
          make public-package

      - name: Upload public CV package artifact
        uses: actions/upload-artifact@v4
        with:
          name: public-cv-package
          path: documents/*.pdf
          if-no-files-found: error
