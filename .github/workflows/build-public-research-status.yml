name: Build Public CV Package

on:
  workflow_dispatch:
    inputs:
      job_object:
        description: 'Public-safe job object to package'
        required: true
        default: 'neutral'
        type: choice
        options:
          - neutral
          - harvard-chan-director-data-analytics
          - indeed-data-scientist-iii
          - rockland-trust-data-architect
          - valo-health-staff-data-scientist
          - unh-adjunct-homeland-security
          - cdc-foundation-data-modernization-senior-advisor
  repository_dispatch:
    types:
      - living-cv-source-updated
  push:
    branches:
      - main
    paths:
      - 'cv/**'
      - 'research/**'
      - 'data/**'
      - 'scripts/**'
      - 'docs/**'
      - 'Makefile'
      - 'README.md'
      - 'PUBLIC_MANIFEST.md'
      - 'docs/IMPERIUM_PROTOCOL.md'
      - '.github/workflows/build-public-research-status.yml'

permissions:
  contents: read

concurrency:
  group: public-cv-package-${{ github.ref }}-${{ inputs.job_object || 'neutral' }}
  cancel-in-progress: true

jobs:
  build-public-package:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' || github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out public repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install LaTeX toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern

      - name: Run public manifest, visibility, and release checks
        run: |
          set -euo pipefail
          python3 scripts/check_imperium_protocol.py
          python3 scripts/test_latin_safeguards.py
          python3 scripts/check_latin_safeguards.py
          make public-manifest-check
          make public-visibility-check
          make safety-surface-check
          make stem-presence-check
          make job-cv-object-check

      - name: Build public CV package from selected job object
        env:
          JOB_OBJECT: ${{ inputs.job_object || 'neutral' }}
        run: |
          set -euo pipefail
          make job-cv-package JOB_OBJECT="$JOB_OBJECT"

      - name: Re-run final public checks
        run: |
          set -euo pipefail
          python3 scripts/check_latin_safeguards.py
          make public-manifest-check
          make public-visibility-check
          make safety-surface-check
          make stem-object-contract
          make stem-report-contract
          make preflight

      - name: Upload LinkedIn-ready Academic CV
        uses: actions/upload-artifact@v4
        with:
          name: linkedin-academic-cv-${{ inputs.job_object || 'neutral' }}
          path: documents/Paul_A_Skeffington_Academic_CV_Public.pdf
          if-no-files-found: error

      - name: Upload full public CV package artifact
        uses: actions/upload-artifact@v4
        with:
          name: public-cv-package-${{ inputs.job_object || 'neutral' }}
          path: documents/*.pdf
          if-no-files-found: error

      - name: Upload selected job CV package artifact
        uses: actions/upload-artifact@v4
        with:
          name: selected-job-cv-package-${{ inputs.job_object || 'neutral' }}
          path: dist/job_cv_packages/**
          if-no-files-found: error

      - name: Upload public render sources
        uses: actions/upload-artifact@v4
        with:
          name: public-render-sources-${{ inputs.job_object || 'neutral' }}
          path: |
            cv/current_projects_public.tex
            cv/skill_scan_report_public.tex
            research/RESEARCH_STATUS.md
            research/generated_project_board.tex
            research/living_source_ledger.md
          if-no-files-found: error

  # Separate publication authority from the read-only compilation job.
  publish-verified-pdfs:
    name: Publicare documenta PDF probata
    needs: build-public-package
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.job_object == 'neutral') }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Accipere fasciculum publicum probatum
        uses: actions/download-artifact@v4
        with:
          name: public-cv-package-${{ inputs.job_object || 'neutral' }}
          path: release-assets

      - name: Documenta et summas cryptographicas comprobare
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            "Paul_A_Skeffington_Academic_CV_Public.pdf"
            "Paul_A_Skeffington_One_Page_Profile_Public.pdf"
            "Index_Safe_Public_Upload_CV.pdf"
            "Paul_A_Skeffington_Research_Status_Public.pdf"
          )
          count="$(find release-assets -maxdepth 1 -type f -name '*.pdf' | wc -l)"
          [[ "$count" -eq "${#expected[@]}" ]] || { echo "Quattuor documenta PDF necessaria sunt."; exit 1; }
          for filename in "${expected[@]}"; do
            path="release-assets/$filename"
            [[ -s "$path" ]] || { echo "Fasciculus deest aut vacuus est: $filename"; exit 1; }
            [[ "$(head -c 5 "$path")" == "%PDF-" ]] || { echo "Initium PDF invalidum: $filename"; exit 1; }
            tail -c 2048 "$path" | grep -aq '%%EOF' || { echo "Finis PDF invalidus: $filename"; exit 1; }
          done
          (
            cd release-assets
            sha256sum "${expected[@]}" > SHA256SUMS
          )
          {
            echo "# Documenta publica probata"
            echo
            echo "Quattuor documenta PDF ex fontibus publice admissis generata et per custodias editionis publicae examinata sunt."
            echo
            echo "- Commit: ${GITHUB_SHA}"
            echo "- GitHub Actions: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Tentamen: ${GITHUB_RUN_ATTEMPT}"
            echo "- Integritas: SHA256SUMS"
            echo
            echo "Documenta ad usum publicum destinantur; nulla assertio extra testimonia fontium recipienda est."
          } > release-assets/RELEASE_NOTES.md

      - name: Editionem GitHub perpetuam creare
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="public-cv-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" \
            release-assets/*.pdf release-assets/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Curriculum vitae et relationes investigationum - $(date -u +%Y-%m-%d)" \
            --notes-file release-assets/RELEASE_NOTES.md \
            --latest
