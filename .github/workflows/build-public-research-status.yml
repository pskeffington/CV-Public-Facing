name: Build Public Research Status

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/**'
      - 'Makefile'
      - '.github/workflows/build-public-research-status.yml'

permissions:
  contents: read

jobs:
  build-research-status:
    runs-on: ubuntu-latest

    steps:
      - name: Check out public repository
        uses: actions/checkout@v4

      - name: Install LaTeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern

      - name: Build public research status PDF
        run: |
          set -euo pipefail
          make research-status

      - name: Upload public research status artifact
        uses: actions/upload-artifact@v4
        with:
          name: public-research-status
          path: documents/Paul_A_Skeffington_Research_Status_Public.pdf
          if-no-files-found: error
