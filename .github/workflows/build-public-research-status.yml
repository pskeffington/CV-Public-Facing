name: Build Public CV Package

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - living-cv-source-updated
  push:
    branches:
      - main
    paths:
      - 'cv/**'
      - 'research/**'
      - 'data/**'
      - 'scripts/**'
      - 'docs/**'
      - 'Makefile'
      - 'README.md'
      - 'PUBLIC_MANIFEST.md'
      - '.github/workflows/build-public-research-status.yml'

permissions:
  contents: read

concurrency:
  group: public-cv-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-public-package:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' || github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out public repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check STEM presence scoring metric
        run: |
          set -euo pipefail
          make stem-presence-check

      - name: Install LaTeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern

      - name: Build public CV package from living repo surfaces
        run: |
          set -euo pipefail
          make public-package

      - name: Upload public CV package artifact
        uses: actions/upload-artifact@v4
        with:
          name: public-cv-package
          path: documents/*.pdf
          if-no-files-found: error

      - name: Upload generated living CV sources
        uses: actions/upload-artifact@v4
        with:
          name: generated-living-cv-sources
          path: |
            cv/current_projects_public.tex
            research/RESEARCH_STATUS.md
            research/generated_project_board.tex
            research/living_source_ledger.md
            research/living_repo_scan.md
          if-no-files-found: error
